[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# ── Project metadata (PEP 621) ──────────────────────────────────────────

[project]
name = "infoflow"
dynamic = ["version"]
description = "Multiplex information-flow network inference from time series: intrinsic, synergistic, and shared transfer, built on dit."
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "Ryan G. James", email = "dit@autoplectic.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "dit>=2.2",
    "networkx>=2.6",
    "numpy>=1.22",
    "scipy>=1.10",
    "xarray>=2023.1",
]

[project.urls]
Homepage = "https://github.com/dit/infoflow"
Repository = "https://github.com/dit/infoflow"

[project.optional-dependencies]
test = [
    "hypothesis>=6.0",
    "pytest>=8",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-xdist",
    "sofic",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-bibtex",
]
parallel = [
    "dask[delayed]",
]
plot = [
    "holoviews",
    "bokeh",
]
causal = [
    "tigramite",
]
gpu = [
    "torch>=2.4",
]
dev = [
    "infoflow[test,docs,parallel]",
    "ruff",
    "ty",
]

# ── uv ──────────────────────────────────────────────────────────────────

# Until the dit release containing dit.inference's Markov-order, ordinal, and
# surrogate tools, develop against the dit PR branch.
[tool.uv.sources]
dit = { git = "https://github.com/dit/dit", branch = "main" }
sofic = { git = "https://github.com/dit/sofic", branch = "main" }

# ── Build configuration ─────────────────────────────────────────────────

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["infoflow/", "tests/", "README.rst", "LICENSE.txt"]

[tool.hatch.build.targets.wheel]
packages = ["infoflow"]

# ── Pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
addopts = [
    "--cov=infoflow",
    "--cov-report=term-missing",
    "--numprocesses=auto",
    "--durations=15",
    "--durations-min=1.0",
    "-m", "not slow",
]
markers = [
    "slow: long-running validation (excluded by default; run with -m slow).",
]
filterwarnings = [
    "ignore::dit.inference.UndersamplingWarning",
]

[tool.coverage.run]
branch = true
source = ["infoflow"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

# ── Ruff ─────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["C408", "E501", "E741", "E731", "N802", "N803", "N806", "N812", "N816", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["infoflow"]

# ── ty (type checking) ──────────────────────────────────────────────────

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
allowed-unresolved-imports = ["dask", "dask.**", "holoviews", "holoviews.**", "tigramite", "tigramite.**", "sofic", "sofic.**", "torch", "torch.**"]

[tool.ty.rules]
unresolved-import = "error"
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-return-type = "warn"
not-subscriptable = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
no-matching-overload = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.src]
include = ["infoflow/", "tests/"]
